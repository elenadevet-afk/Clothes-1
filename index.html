<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор игры для Genially</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #f8f9fa;
            --text: #2d3436;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h2 { color: var(--primary); margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input[type="text"], input[type="url"] {
            width: 100%; padding: 10px; border: 1px solid #dfe6e9; border-radius: 8px; box-sizing: border-box;
        }
        button {
            background: var(--primary);
            color: white; border: none; padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-size: 14px;
        }
        button:hover { opacity: 0.9; }
        .items-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .items-table th, .items-table td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
        .items-table img { width: 35px; height: 35px; object-fit: contain; }
        
        .output-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #b2bec3;
            margin-top: 20px;
        }
        textarea {
            width: 100%; height: 80px; padding: 10px; font-family: monospace; font-size: 12px;
            border: 1px solid #dfe6e9; border-radius: 6px; box-sizing: border-box; resize: none;
        }
        .preview-container {
            margin-top: 20px;
            text-align: center;
        }
        iframe {
            width: 750px; height: 450px; border: 1px solid #dfe6e9; border-radius: 12px; background: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Конструктор игры «Одень персонажа» для Genially</h2>
    
    <div class="form-group">
        <label>Ссылка на картинку персонажа (PNG с прозрачным фоном):</label>
        <input type="url" id="charUrl" value="https://i.imgur.com/8Km9tWW.png" oninput="updateOutput()">
    </div>

    <div class="form-group">
        <label>Элементы одежды и задания:</label>
        <table class="items-table" id="itemsTable">
            <thead>
                <tr>
                    <th>Вещь (Картинка)</th>
                    <th>English</th>
                    <th>Перевод</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
        </table>
        
        <div style="display: flex; gap: 10px;">
            <input type="text" id="newEn" placeholder="English (Hat)" style="flex:1;">
            <input type="text" id="newRu" placeholder="Перевод (Шляпа)" style="flex:1;">
            <input type="url" id="newImg" placeholder="URL картинки вещи" style="flex:2;">
            <button type="button" onclick="addItem()">Добавить</button>
        </div>
    </div>

    <div class="output-box">
        <label>Готовый код Iframe для вставки в Genially:</label>
        <textarea id="iframeCode" readonly onclick="this.select()"></textarea>
    </div>

    <div class="preview-container">
        <label>Предпросмотр игры:</label>
        <iframe id="gamePreview"></iframe>
    </div>
</div>

<script>
    // Базовый демонстрационный набор
    let gameConfig = {
        character: "https://i.imgur.com/8Km9tWW.png",
        items: [
            { en: "Hat", ru: "Шляпа", img: "https://i.imgur.com/95Xg4y6.png" },
            { en: "Glasses", ru: "Очки", img: "https://i.imgur.com/5Xg4y69.png" },
            { en: "Shoes", ru: "Обувь", img: "https://i.imgur.com/4Xg4y69.png" }
        ]
    };

    function renderTable() {
        const tbody = document.getElementById('itemsBody');
        tbody.innerHTML = '';
        gameConfig.items.forEach((item, index) => {
            tbody.innerHTML += `
                <tr>
                    <td><img src="${item.img}" alt=""></td>
                    <td>${item.en}</td>
                    <td>${item.ru}</td>
                    <td><button onclick="removeItem(${index})" style="background:#ff7675; padding: 5px 10px; font-size:12px;">Удалить</button></td>
                </tr>
            `;
        });
        updateOutput();
    }

    function addItem() {
        const en = document.getElementById('newEn').value.trim();
        const ru = document.getElementById('newRu').value.trim();
        const img = document.getElementById('newImg').value.trim();
        if(en && ru && img) {
            gameConfig.items.push({ en, ru, img });
            document.getElementById('newEn').value = '';
            document.getElementById('newRu').value = '';
            document.getElementById('newImg').value = '';
            renderTable();
        } else {
            alert('Заполните все поля для одежды!');
        }
    }

    function removeItem(index) {
        gameConfig.items.splice(index, 1);
        renderTable();
    }

    function updateOutput() {
        gameConfig.character = document.getElementById('charUrl').value;
        
        // Кодируем всю конфигурацию в Base64 для передачи через URL
        const jsonStr = JSON.stringify(gameConfig);
        const encodedData = btoa(encodeURIComponent(jsonStr));
        
        // В качестве хоста игры используется публичный скрипт-обработчик (или ваша постоянная ссылка на развернутый файл игры)
        // Здесь для примера используется Blob URL, но для Genially лучше один раз закинуть файл игры на GitHub Pages / Netlify, 
        // а редактор будет формировать ссылку вида: https://ваш-сайт.com/game.html?data=...
        
        const gameUrl = "https://example.com/game.html?data=" + encodedData; // Замените example.com на адрес вашего хостинга с игрой
        
        const iframeTag = `<iframe src="${gameUrl}" width="100%" height="100%" style="border:none;"></iframe>`;
        
        document.getElementById('iframeCode').value = iframeTag;
        
        // Генерируем локальный предпросмотр через Blob
        const fullGameHtml = generateGameHtml(gameConfig);
        const blob = new Blob([fullGameHtml], { type: 'text/html' });
        document.getElementById('gamePreview').src = URL.createObjectURL(blob);
    }

    function generateGameHtml(config) {
        return `<!DOCTYPE html>
        <html lang="ru"><head><meta charset="UTF-8"><style>
        body { font-family: sans-serif; background: transparent; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .layout { display: flex; gap: 15px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .stage { width: 260px; height: 350px; border: 2px dashed #6c5ce7; border-radius: 10px; position: relative; display: flex; justify-content: center; align-items: center; background: #fdfdfd; overflow: hidden; }
        .stage img.char { max-width: 100%; max-height: 100%; position: absolute; object-fit: contain; }
        .stage img.item { position: absolute; max-width: 120px; max-height: 120px; object-fit: contain; pointer-events: none; }
        .wardrobe { width: 220px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 350px; overflow-y: auto; }
        .card { border: 1px solid #eee; border-radius: 8px; padding: 5px; text-align: center; cursor: pointer; background: #fff; }
        .card:hover { border-color: #6c5ce7; }
        .card img { width: 45px; height: 45px; object-fit: contain; }
        .card span { font-size: 11px; display: block; color: #555; font-weight: bold; margin-top: 3px; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:none; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:20px; border-radius:10px; width:260px; text-align:center; }
        .btn-opt { display:block; width:100%; margin-top:8px; padding:8px; background:#f1f2f6; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
        .btn-opt:hover { background:#dfe6e9; }
        </style></head><body>
        <div class="layout">
            <div class="stage" id="stage"><img class="char" src="${config.character}"></div>
            <div class="wardrobe" id="wardrobe"></div>
        </div>
        <div class="modal" id="modal"><div class="modal-content">
            <h4 style="margin:0 0 10px 0; color:#6c5ce7;" id="qTitle">Перевод:</h4>
            <div id="qOptions"></div>
        </div></div>
        <script>
        const items = ${JSON.stringify(config.items)};
        let targetImg = "";
        const wardrobe = document.getElementById('wardrobe');
        
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = '<img src="'+item.img+'"><span>'+item.en+'</span>';
            div.onclick = () => openQuiz(item);
            wardrobe.appendChild(div);
        });

        function openQuiz(item) {
            targetImg = item.img;
            document.getElementById('qTitle').innerText = 'Переведите: "' + item.ru + '"';
            const optsDiv = document.getElementById('qOptions');
            optsDiv.innerHTML = '';
            
            let opts = [item.en];
            while(opts.length < 3 && opts.length < items.length) {
                let r = items[Math.floor(Math.random()*items.length)].en;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);

            opts.forEach(o => {
                const b = document.createElement('button');
                b.className = 'btn-opt';
                b.innerText = o;
                b.onclick = () => check(o, item.en);
                optsDiv.appendChild(b);
            });
            document.getElementById('modal').style.display = 'flex';
        }

        function check(sel, cor) {
            document.getElementById('modal').style.display = 'none';
            if(sel === cor) {
                if(!document.getElementById('i-' + targetImg)) {
                    const im = document.createElement('img');
                    im.src = targetImg;
                    im.className = 'item';
                    im.id = 'i-' + targetImg;
                    document.getElementById('stage').appendChild(im);
                }
            } else {
                alert('Неверно!');
            }
        }
        <\/script></body></html>`;
    }

    renderTable();
</script>

</body>
</html>
