<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Интерактивная игра — Одень куклу (Paper Doll)</title>

  <style>
    :root{
      --ui-acc:#ff6b81;
      --ui-acc2:#ff4757;
      --bg:#0b0b0d;
      --card:#121215;
      --ink:#f1f1f1;
      --muted:#b8b8b8;
      --stroke:#26262a;
      --radius:16px;
    }

    *{box-sizing:border-box}
    html,body{height:100%; margin:0;}
    body{
      background: radial-gradient(1200px 600px at 20% -10%, rgba(255,107,129,.15), transparent 60%),
                  radial-gradient(900px 500px at 80% 0%, rgba(112,161,255,.1), transparent 55%),
                  var(--bg);
      color:var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding: 16px;
    }

    .game-container {
      width: 100%;
      max-width: 850px;
      height: 600px;
      background: rgba(18, 18, 21, 0.85);
      border: 2px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    header{
      padding: 14px 20px;
      border-bottom: 1px solid var(--stroke);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.2);
    }

    .quest-box {
      font-size: 18px;
      font-weight: 900;
      color: var(--ui-acc);
    }

    .counter {
      font-size: 14px;
      background: rgba(255,255,255,0.08);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .game-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 300px;
      position: relative;
    }

    /* Зона куклы */
    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 70%);
    }

    .doll-wrapper {
      position: relative;
      width: 220px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .doll-base {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
    }

    /* Слой для надетых вещей */
    .equipped-slot {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      object-fit: contain;
    }

    /* Гардероб (панель с вещами) */
    .wardrobe-panel {
      border-left: 1px solid var(--stroke);
      background: rgba(0,0,0,0.3);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .wardrobe-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .clothing-item {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      transition: all 0.2s ease;
      user-select: none;
    }

    .clothing-item:hover {
      background: rgba(255, 107, 129, 0.1);
      border-color: var(--ui-acc);
      transform: translateY(-2px);
    }

    .clothing-item:active {
      cursor: grabbing;
    }

    .clothing-item img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      pointer-events: none;
    }

    .clothing-item span {
      font-size: 11px;
      font-weight: 700;
      margin-top: 6px;
      text-align: center;
      color: #fff;
    }

    /* Фидбек при победе */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 11, 13, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-overlay img {
      width: 220px;
      height: 220px;
      object-fit: contain;
    }
    .modal-overlay h2 {
      margin: 0;
      color: var(--ui-acc);
      font-size: 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <div class="quest-box" id="questText">Loading task...</div>
      <div class="counter" id="counterText">1 / 3</div>
    </header>

    <div class="game-body">
      <!-- Зона куклы -->
      <div class="stage" id="dropZone">
        <div class="doll-wrapper">
          <img id="dollBase" class="doll-base" src="https://i.postimg.cc/k4Z82v8w/doll-base.png" alt="Doll">
          <div id="equippedContainer"></div>
        </div>
      </div>

      <!-- Панель гардероба -->
      <div class="wardrobe-panel">
        <div class="wardrobe-title">Wardrobe</div>
        <div class="items-grid" id="itemsGrid"></div>
      </div>
    </div>

    <!-- Фидбек-модалка -->
    <div class="modal-overlay" id="winModal">
      <img id="feedbackImg" src="https://i.postimg.cc/prHF0XG1/AI-(4).gif" alt="Success">
      <h2 id="feedbackText">🎉 Perfect Outfit! Great job!</h2>
    </div>
  </div>

  <script>
    // НАСТРОЙКИ ИГРЫ: Вы можете менять тексты заданий, названия вещей и ссылки на картинки прямо здесь.
    const gameData = {
      dollImage: "https://i.postimg.cc/k4Z82v8w/doll-base.png",
      feedbackImage: "https://i.postimg.cc/prHF0XG1/AI-(4).gif",
      finalFeedback: "🎉 Wonderful! All outfits are correct!",
      tasks: [
        { instruction: "Put on the red sweater for school.", target: "Red sweater" },
        { instruction: "Put on comfortable blue jeans for a walk.", target: "Blue jeans" },
        { instruction: "Put on warm yellow sneakers.", target: "Yellow sneakers" }
      ],
      wardrobe: [
        { name: "Red sweater", category: "top", image: "https://i.postimg.cc/3w3826v9/sweater.png" },
        { name: "Blue jeans", category: "bottom", image: "https://i.postimg.cc/52839210/jeans.png" },
        { name: "Yellow sneakers", category: "shoes", image: "https://i.postimg.cc/90218129/sneakers.png" },
        { name: "Pink hat", category: "head", image: "https://i.postimg.cc/21892182/hat.png" }
      ]
    };

    let currentTaskIndex = 0;

    function initGame() {
      document.getElementById('dollBase').src = gameData.dollImage;
      renderWardrobe();
      loadTask();
    }

    function renderWardrobe() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      gameData.wardrobe.forEach(item => {
        const div = document.createElement('div');
        div.className = 'clothing-item';
        div.draggable = true;
        
        div.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <span>${item.name}</span>
        `;

        // Клик для выбора (удобно для планшетов и телефонов)
        div.addEventListener('click', () => checkChoice(item.name));

        // Перетаскивание (Drag and Drop для ПК)
        div.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', item.name);
        });

        grid.appendChild(div);
      });

      const dropZone = document.getElementById('dropZone');
      dropZone.addEventListener('dragover', (e) => e.preventDefault());
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        const itemName = e.dataTransfer.getData('text/plain');
        checkChoice(itemName);
      });
    }

    function loadTask() {
      if (currentTaskIndex >= gameData.tasks.length) {
        showWinScreen();
        return;
      }
      const task = gameData.tasks[currentTaskIndex];
      document.getElementById('questText').textContent = task.instruction;
      document.getElementById('counterText').textContent = `${currentTaskIndex + 1} / ${gameData.tasks.length}`;
    }

    function checkChoice(selectedName) {
      const task = gameData.tasks[currentTaskIndex];
      
      if (selectedName === task.target) {
        const itemObj = gameData.wardrobe.find(i => i.name === selectedName);
        if (itemObj) {
          const equipped = document.getElementById('equippedContainer');
          const img = document.createElement('img');
          img.src = itemObj.image;
          img.className = 'equipped-slot';
          equipped.appendChild(img);
        }

        currentTaskIndex++;
        loadTask();
      } else {
        const questBox = document.getElementById('questText');
        questBox.style.color = '#ff4757';
        setTimeout(() => { questBox.style.color = 'var(--ui-acc)'; }, 400);
      }
    }

    function showWinScreen() {
      document.getElementById('feedbackText').textContent = gameData.finalFeedback;
      document.getElementById('feedbackImg').src = gameData.feedbackImage;
      document.getElementById('winModal').classList.add('active');
    }

    window.onload = initGame;
  </script>
</body>
</html>
